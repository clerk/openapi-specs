        id:
          type: string
          description: The unique identifier for the iOS application registration.
        app_id_prefix:
          type: string
          description: The Apple App ID Prefix associated with the application. For most apps, this is the Apple Developer Team ID.
        bundle_id:
          type: string
          description: The application's bundle identifier.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the registration was created.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the registration was last updated.
      required:
        - object
        - id
        - app_id_prefix
        - bundle_id
        - created_at
        - updated_at
    PlatformCreateIOSApplicationRequest:
      title: Create iOS native application request
      type: object
      additionalProperties: false
      properties:
        app_id_prefix:
          type: string
          minLength: 1
          maxLength: 255
          description: The Apple App ID Prefix associated with the application. For most apps, this is the Team ID. Confirm it in the app's identifier in the Apple Developer portal.
        bundle_id:
          type: string
          minLength: 1
          maxLength: 255
          description: The application's bundle identifier.
      required:
        - app_id_prefix
        - bundle_id
    PlatformConfigResponse:
