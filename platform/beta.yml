        external_id:
          type: string
          nullable: true
          description: External identifier. Must be unique in the instance.
        timezone:
          type: string
          nullable: true
          description: IANA timezone identifier.
        locale:
          type: string
          description: Supported locale, subject to Backend API validation.
        bypass_client_trust:
          type: boolean
          description: Whether to bypass client trust checks for this user.
    PlatformUpdateUserMetadataRequest:
      type: object
      properties:
        public_metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: BAPI merge patch. Null keys are removed at merged levels; new nested objects are copied as-is, including nulls. Omitting this field or setting it to null leaves its metadata unchanged.
        private_metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: BAPI merge patch. Null keys are removed at merged levels; new nested objects are copied as-is, including nulls. Omitting this field or setting it to null leaves its metadata unchanged.
        unsafe_metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: BAPI merge patch. Null keys are removed at merged levels; new nested objects are copied as-is, including nulls. Omitting this field or setting it to null leaves its metadata unchanged.
    JWTTemplate:
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - jwt_template
        id:
          type: string
        name:
          type: string
        claims:
          type: object
        lifetime:
          type: integer
        allowed_clock_skew:
          type: integer
        custom_signing_key:
          type: boolean
        signing_algorithm:
          type: string
        created_at:
          type: integer
          format: int64
          description: |
            Unix timestamp of creation.
        updated_at:
          type: integer
          format: int64
          description: |
            Unix timestamp of last update.
      required:
        - object
        - id
        - name
        - claims
        - lifetime
        - allowed_clock_skew
        - custom_signing_key
        - signing_algorithm
        - created_at
        - updated_at
    RedirectURL:
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - redirect_url
        id:
          type: string
        url:
          type: string
        created_at:
          type: integer
          format: int64
          description: |
            Unix timestamp of creation.
        updated_at:
          type: integer
          format: int64
          description: |
            Unix timestamp of last update.
      required:
        - object
        - id
        - url
        - created_at
        - updated_at
    PlatformListRedirectURLsResponse:
      title: List Redirect URLs Response
      description: A paginated list of redirect URLs for an application instance.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          description: The list of redirect URLs.
          items:
            $ref: '#/components/schemas/RedirectURL'
        total_count:
          type: integer
          format: int64
          description: The total number of redirect URLs in the instance.
          example: 3
      required:
        - data
        - total_count
    PlatformOAuthResource:
      title: OAuth resource
      description: An instance-scoped OAuth protected resource. Its URI is the audience that access tokens carry when a client requests it as the RFC 8707 `resource`, and MCP servers register themselves here.
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - oauth_resource
          description: The object type.
        id:
          type: string
          description: The OAuth resource ID.
        uri:
          type: string
          description: The absolute URI identifying the protected API, as normalized on write. It cannot be changed after creation.
        name:
          type: string
          description: A display name of at most 100 bytes.
        scopes:
          type: array
          description: Custom scopes the resource accepts, filtered to the instance's current scope catalog. Empty for MCP servers that do not take part in token exchange.
          items:
            type: string
        oauth_application_id:
          type: string
          nullable: true
          description: The confidential OAuth application that currently uses this resource as its audience, if any.
        reserved_oauth_application_id:
          type: string
          nullable: true
          description: The OAuth application that permanently reserved this URI as an audience, if any.
        mcp_server:
          type: boolean
          description: Whether the resource is an MCP server. The marker is a label only and is never read by token issuance or exchange.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds of when the resource was created.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds of when the resource was last updated.
      required:
        - object
        - id
        - uri
        - name
        - scopes
        - oauth_application_id
        - reserved_oauth_application_id
        - mcp_server
        - created_at
        - updated_at
    PlatformListOAuthResourcesResponse:
      title: List OAuth resources response
      description: A paginated list of OAuth resources for an application instance.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          description: The list of OAuth resources.
          items:
            $ref: '#/components/schemas/PlatformOAuthResource'
        total_count:
          type: integer
          format: int64
          description: The total number of OAuth resources matching the filters.
          example: 2
      required:
        - data
        - total_count
    PlatformCreateOAuthResourceRequest:
      title: Create OAuth resource request
      type: object
      additionalProperties: false
      properties:
        uri:
          type: string
          description: The absolute URI identifying the protected API. It must have no fragment, and when it uses the http or https scheme must include a host and no user information. For an MCP server, use the exact URL MCP clients send as the RFC 8707 `resource`, for example `https://mcp.example.com/mcp`.
          maxLength: 2048
        name:
          type: string
          description: A display name of at most 100 bytes.
          maxLength: 100
        scopes:
          type: array
          description: Custom scopes from the instance's scope catalog. Omitted means none.
          items:
            type: string
        mcp_server:
          type: boolean
          description: Mark the resource as an MCP server. Omitted means false.
      required:
        - uri
        - name
    PlatformUpdateOAuthResourceRequest:
      title: Update OAuth resource request
      description: Only supplied fields change. The URI is create-only.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: A display name of at most 100 bytes.
          maxLength: 100
        scopes:
          type: array
          description: Replaces the resource's custom scopes.
          items:
            type: string
        mcp_server:
          type: boolean
          description: Set or clear the MCP server marker. It is accepted on app-backed resources too.
    PlatformOAuthApplicationSettings:
      title: OAuth application settings
      description: Instance-wide settings for the OAuth authorization server Clerk runs for the instance.
      type: object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - oauth_application_settings
          description: The object type.
        dynamic_oauth_client_registration:
          type: boolean
          description: Whether dynamic OAuth client registration is enabled for the instance (RFC 7591).
        dynamic_client_allowed_scopes:
          type: array
          nullable: true
          description: Administrator-selected scope ceiling for dynamically registered and automatically admitted CIMD clients. Null preserves registered client limits.
          items:
            type: string
        default_scopes:
          type: array
          nullable: true
          description: Default scopes assigned when a dynamically registered or first-contact CIMD client omits `scope`. Null means Clerk-provided defaults.
          items:
            type: string
        oauth_jwt_access_tokens:
          type: boolean
          description: Whether OAuth access tokens are JWTs. When false, access tokens are opaque.
        oidc_sign_out_enabled:
          type: boolean
          description: Whether OIDC RP-initiated sign-out is enabled for the instance.
        aud_claim_enabled:
          type: boolean
          description: Whether OAuth access tokens carry an `aud` claim derived from the RFC 8707 `resource` parameter. MCP servers need this to validate token audiences.
        aud_claim_refresh_backfill_enabled:
          type: boolean
          description: Whether refresh grants without a resource can adopt the requested resource when audience claims are enabled.
        pkce_required:
          type: boolean
          description: Whether all new OAuth authorization-code requests must use PKCE with the S256 challenge method.
        client_id_metadata_documents_advertised:
          type: boolean
          description: Whether the instance advertises and admits Client ID Metadata Document clients. Unknown CIMD clients are refused while this is false.
        client_id_metadata_documents_only_allow_pre_registered_clients:
          type: boolean
          description: When true, new unknown CIMD clients are rejected. Previously auto-connected and pre-registered clients remain admitted.
        client_id_metadata_documents_block_implicitly_allowed_clients:
          type: boolean
          description: When true, recorded implicitly allowed CIMD clients are rejected on future client lookups.
      required:
        - object
        - dynamic_oauth_client_registration
        - dynamic_client_allowed_scopes
        - default_scopes
        - oauth_jwt_access_tokens
        - oidc_sign_out_enabled
        - aud_claim_enabled
        - aud_claim_refresh_backfill_enabled
        - pkce_required
        - client_id_metadata_documents_advertised
        - client_id_metadata_documents_only_allow_pre_registered_clients
        - client_id_metadata_documents_block_implicitly_allowed_clients
    PlatformUpdateOAuthApplicationSettingsRequest:
      title: Update OAuth application settings request
      description: Only supplied fields change.
      type: object
      additionalProperties: false
      properties:
        dynamic_oauth_client_registration:
          type: boolean
          nullable: true
          description: Whether dynamic OAuth client registration is enabled for the instance (RFC 7591).
        dynamic_client_allowed_scopes:
          type: array
          nullable: true
          description: Administrator-selected scope ceiling for dynamically registered and automatically admitted CIMD clients.
          items:
            type: string
        default_scopes:
          type: array
          nullable: true
          description: Default scopes assigned when a dynamically registered or first-contact CIMD client omits `scope`. An empty array or null resets to Clerk-provided defaults.
          items:
            type: string
        oauth_jwt_access_tokens:
          type: boolean
          nullable: true
          description: Whether OAuth access tokens are JWTs. When false, access tokens are opaque.
        oidc_sign_out_enabled:
          type: boolean
          nullable: true
          description: Whether OIDC RP-initiated sign-out is enabled for the instance.
        aud_claim_enabled:
          type: boolean
          nullable: true
          description: Whether OAuth access tokens carry an `aud` claim derived from the RFC 8707 `resource` parameter.
        aud_claim_refresh_backfill_enabled:
          type: boolean
          nullable: true
          description: Whether refresh grants without a resource can adopt the requested resource when audience claims are enabled.
        pkce_required:
          type: boolean
          nullable: true
          description: Whether all new OAuth authorization-code requests must use PKCE with the S256 challenge method.
        client_id_metadata_documents_advertised:
          type: boolean
          nullable: true
          description: Whether the instance advertises and admits Client ID Metadata Document clients.
        client_id_metadata_documents_only_allow_pre_registered_clients:
          type: boolean
          nullable: true
          description: When true, new unknown CIMD clients are rejected.
        client_id_metadata_documents_block_implicitly_allowed_clients:
          type: boolean
          nullable: true
          description: When true, recorded implicitly allowed CIMD clients are rejected on future client lookups. Requires only pre-registered clients to be allowed.
    PlatformNativeSettings:
