    patch:
      operationId: PlatformUpdateUserMetadata
      x-speakeasy-group: platform
      x-speakeasy-name-override: updateUserMetadata
      tags:
        - Users
      summary: Update user metadata
      description: |
        Deep-merge the supplied public, private and unsafe metadata into a user in the selected instance.
        Existing nested objects merge recursively, removing null-valued keys at each merged level.
        New nested objects and objects replacing non-object values are copied as-is, including nulls,
        matching BAPI. Arrays and scalar values replace existing values. Without a cached
        idempotency response, repeating a patch containing a new nested object with nulls can change its result.
        Omitted metadata fields, empty metadata objects and null metadata fields leave existing
        metadata unchanged. The patch and merged result must each fit the 8 KB limit per metadata field.

        Requires the `users:manage` scope. The user must belong to the selected application instance.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
        - name: envOrInsID
          in: path
          description: |
            Environment type (e.g., "development", "production") or instance ID.
          required: true
          schema:
            type: string
        - name: userID
          in: path
          description: User ID.
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: |
            Optional key. If Clerk has cached a completed response for this exact request
            and key, Clerk replays that response without merging the metadata again.
            Reuse the same key only for the same request.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[A-Za-z0-9_-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdateUserMetadataRequest'
      responses:
        '200':
          description: User metadata updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '413':
          $ref: '#/components/responses/ClerkErrors'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
