  /platform/applications/{applicationID}/instances:
    post:
      operationId: PlatformCreateInstance
      x-speakeasy-group: platform
      x-speakeasy-name-override: createInstance
      tags:
        - Applications
      summary: Create instance
      description: |
        Creates a production instance for the given application. Optionally clones
        configuration from an existing development instance.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                domain:
                  type: string
                  description: The production domain for the instance (e.g. "example.com").
                environment_type:
                  type: string
                  enum:
                    - production
                  default: production
                  description: Instance environment type. Only production is currently supported.
                clone_instance_id:
                  type: string
                  nullable: true
                  description: The ID of a development instance to clone configuration from.
              required:
                - domain
      responses:
        '201':
          description: Instance created successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  object:
                    type: string
                    enum:
                      - instance
                  id:
                    type: string
                  environment_type:
                    type: string
                    enum:
                      - production
                  active_domain:
                    $ref: '#/components/schemas/PlatformDomainResponse'
                  secret_key:
                    type: string
                    x-sensitive: true
                  publishable_key:
                    type: string
                  created_at:
                    type: integer
                    format: int64
                    description: Unix timestamp in milliseconds.
                  updated_at:
                    type: integer
                    format: int64
                    description: Unix timestamp in milliseconds.
                required:
                  - object
                  - id
                  - environment_type
                  - active_domain
                  - secret_key
                  - publishable_key
                  - created_at
                  - updated_at
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /platform/accountless_applications/claim:
    post:
      operationId: PlatformClaimAccountlessApplication
      x-speakeasy-group: platform
      x-speakeasy-name-override: claimAccountlessApplication
      tags:
        - Applications
      summary: Claim an accountless application
      description: |
        Claim an accountless application by assigning it to the authenticated principal's workspace.
        The application is identified by a single-use claim token that was generated when the
        accountless application was created. Once claimed, the token is invalidated and cannot be reused.
      security:
        - platform_api_access_token: []
      requestBody:
        description: Claim token and application name.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  description: The single-use claim token for the accountless application.
                name:
                  type: string
                  description: The name to assign to the claimed application.
                  maxLength: 50
              required:
                - token
                - name
      responses:
        '200':
          description: Application claimed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApplicationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    platform_api_access_token:
      type: http
      scheme: bearer
      description: Platform API access token.
  schemas:
    Organization:
      type: object
      properties:
        object:
          type: string
          enum:
            - organization
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        image_url:
          type: string
        has_image:
          type: boolean
        members_count:
          type: integer
        missing_member_with_elevated_permissions:
          type: boolean
        pending_invitations_count:
          type: integer
        max_allowed_memberships:
          type: integer
        admin_delete_enabled:
          type: boolean
        self_serve_sso_enabled:
          type: boolean
          description: |
            Whether this organization can configure self-serve enterprise SSO.
        self_serve_directory_sync_enabled:
          type: boolean
          description: |
            Whether this organization can configure self-serve Directory Sync (SCIM).
        public_metadata:
          type: object
          additionalProperties: true
        private_metadata:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: integer
          format: int64
          description: |
            Unix timestamp of creation.
        updated_at:
          type: integer
          format: int64
          description: |
            Unix timestamp of last update.
        last_active_at:
          type: integer
          format: int64
          description: |
            Unix timestamp of last activity.
        role_set_key:
          type: string
          description: |
            The key of the [role set](https://clerk.com/docs/guides/organizations/control-access/role-sets) assigned to this organization.
          nullable: true
      required:
        - object
        - id
        - name
        - slug
        - has_image
        - max_allowed_memberships
        - admin_delete_enabled
        - public_metadata
        - created_at
        - updated_at
    OrganizationMembershipPublicUserData:
      description: An organization membership with public user data populated
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
          nullable: false
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        profile_image_url:
          type: string
          nullable: true
          deprecated: true
        image_url:
          type: string
        has_image:
          type: boolean
        identifier:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        banned:
          type: boolean
        deprovisioned:
          type: boolean
      required:
        - user_id
        - first_name
        - last_name
        - profile_image_url
        - image_url
        - has_image
    OrganizationMembership:
      description: A user's membership in an organization
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          description: |
            String representing the object's type. Objects of the same type share the same value.
          enum:
            - organization_membership
        role:
          type: string
        role_name:
          type: string
        permissions:
          type: array
          items:
            type: string
        public_metadata:
          type: object
          description: Metadata saved on the organization membership, accessible from both Frontend and Backend APIs
          additionalProperties: true
        private_metadata:
          type: object
          description: Metadata saved on the organization membership, accessible only from the Backend API
          additionalProperties: true
        organization:
          type: object
          nullable: false
          allOf:
            - $ref: '#/components/schemas/Organization'
        public_user_data:
          $ref: '#/components/schemas/OrganizationMembershipPublicUserData'
        created_at:
          type: integer
          format: int64
          description: Unix timestamp of creation.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp of last update.
      required:
        - object
        - id
        - role
        - permissions
        - public_metadata
        - created_at
        - updated_at
        - organization
    OrganizationMemberships:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
        total_count:
          type: integer
          format: int64
          description: |
            Total number of organization memberships
      required:
        - data
        - total_count
    ClerkError:
      type: object
      properties:
        message:
          type: string
        long_message:
          type: string
        code:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
        - message
        - long_message
        - code
    ClerkErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ClerkError'
        meta:
          type: object
          additionalProperties: true
        clerk_trace_id:
          type: string
      required:
        - errors
    Organizations:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        total_count:
          type: integer
          format: int64
          description: |
            Total number of organizations
      required:
        - data
        - total_count
    PlatformApplicationInstance:
      title: Application Instance
      description: Represents an instance (environment) within a Clerk application. Each application can have multiple instances, typically one for development and one for production.
      type: object
      additionalProperties: false
      properties:
        instance_id:
          type: string
          description: The unique identifier for this instance. Use this ID when making API calls that target a specific instance.
          example: ins_2abc123def456
        environment_type:
          type: string
          description: The environment type of the instance. Determines whether this instance is used for development/testing or production workloads.
          enum:
            - development
            - production
          example: production
        secret_key:
          type: string
          description: The secret key for authenticating server-side API requests to this instance. Keep this value secure and never expose it in client-side code.
          example: sk_live_abc123...
          x-sensitive: true
        publishable_key:
          type: string
          description: The publishable key for this instance. Safe to include in client-side code and used to initialize Clerk SDKs in the browser.
          example: pk_live_abc123...
      required:
        - instance_id
        - environment_type
    PlatformApplicationResponse:
      type: object
      additionalProperties: false
      properties:
        application_id:
          type: string
          description: The ID of the application.
        name:
          type: string
          description: The name of the application.
        instances:
          type: array
          description: List of instances associated with this application.
          items:
            $ref: '#/components/schemas/PlatformApplicationInstance'
      required:
        - application_id
        - name
        - instances
    PlatformListApplicationsResponse:
      type: array
      items:
        $ref: '#/components/schemas/PlatformApplicationResponse'
      minItems: 0
    PlatformListApplicationsCursorResponse:
      title: List Applications Cursor Response
      description: A page of applications, returned with `paginated=true`.
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          description: The list of applications.
          items:
            $ref: '#/components/schemas/PlatformApplicationResponse'
        cursor:
          type: object
          additionalProperties: false
          description: Cursor information for pagination.
          properties:
            starting_after:
              type: string
              nullable: true
              description: Cursor to fetch the next page of results. Pass it back as `starting_after` on the next request. `null` on the last page.
            ending_before:
              type: string
              nullable: true
              description: Cursor to fetch the previous page of results. Pass it back as `ending_before` on the next request. `null` on the first page.
            has_next_page:
              type: boolean
              description: Whether older applications follow this page.
          required:
            - starting_after
            - ending_before
            - has_next_page
      required:
        - data
        - cursor
    PlatformCreateApplicationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: The name of the application.
        domain:
          type: string
          description: The domain for the application (optional).
        proxy_path:
          type: string
          description: Custom proxy path for provider domains (e.g., "/__clerk"). Must start with a leading slash and be a single path segment. Defaults to "/__clerk" if not provided.
        environment_types:
          type: array
          items:
            type: string
          description: List of environment types to create instances for. Accepted values are "development" and "production". Defaults to "development" if not provided.
        template:
          type: string
          description: Application template to use for configuring the application (e.g., "b2b-saas", "b2c-saas", "waitlist").
      required:
        - name
    PlatformDeletedObjectResponse:
      type: object
      additionalProperties: false
      properties:
        deleted:
          type: boolean
          description: Whether the object was deleted.
        object:
          type: string
          example: deleted
        id:
          type: string
          description: The ID of the deleted resource.
