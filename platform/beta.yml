          description: The Digital Asset Links namespace, typically `android_app`.
        package_name:
          type: string
          description: The application's Android package name.
        fingerprints:
          type: array
          description: SHA-256 certificate fingerprints used to associate the Android application with the application instance.
          items:
            type: string
        created_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the registration was created.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the registration was last updated.
      required:
        - object
        - id
        - namespace
        - package_name
        - fingerprints
        - created_at
        - updated_at
    PlatformCreateAndroidApplicationRequest:
      title: Create Android native application request
      type: object
      additionalProperties: false
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 255
          description: The Digital Asset Links namespace, typically `android_app`.
        package_name:
          type: string
          minLength: 1
          maxLength: 255
          description: The application's Android package name.
        fingerprints:
          type: array
          description: SHA-256 certificate fingerprints for the Android application's signing certificates. Fingerprints are required to use passkeys.
          items:
            type: string
      required:
