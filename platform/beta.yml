openapi: 3.0.3
info:
  title: Clerk Platform API
  x-logo:
    url: https://clerk.com/_next/image?url=%2Fimages%2Fclerk-logo.svg&w=96&q=75
    altText: Clerk docs
    href: https://clerk.com/docs
  contact:
    email: support@clerk.com
    name: Clerk Platform Team
    url: https://clerk.com/support
  description: |-
    The Clerk REST Platform API, for programmatic management of resources of a workspace.

    > [!note]
    > This API is currently in private beta. If you'd like access for your workspace, please fill out and submit our [request form](https://clerkdev.notion.site/2df2b9ab44fe803f9031e9f3185c5e19).
  version: BETA
  termsOfService: https://clerk.com/terms
  license:
    name: MIT
    url: https://github.com/clerk/openapi-specs/blob/main/LICENSE
servers:
  - url: https://api.clerk.com/v1
security:
  - platform_api_access_token: []
tags:
  - name: Applications
    description: An object representing a Clerk application. Each `application` can have multiple `instances`, typically one for development and one for production, each with distinct user pools.
  - name: Principal
    description: The credential that authenticated a request, and what it is allowed to do.
  - name: Domains
    description: An object representing a domain associated with a Clerk application. In development `instances`, a domain is provided by Clerk. Production `instances` require additional configuration to be set up.
  - name: Domain Intents
    description: |-
      An object representing the intent to create a Clerk domain.
      The high-level for domain intent consumption:
      1. Create a domain intent, and receive the DNS records for the future domain to function. 2. Create a domain, supplying the intent ID.
  - name: Application Transfers
    description: |-
      An object representing a transfer request for an application between workspaces.

      The high-level flow for application transfer:

      1. The initial workspace can create an application transfer. A single-use `code` will be generated which may be distributed to any end-user of Clerk.
      2. The code must be claimed through the clerk dashboard: https://dashboard.clerk.com/apps/transfer?code=<...>

      Note that once a transfer is claimed, the original workspace will no longer have access to the application.
  - name: Users
    description: Operations for managing users within an application instance.
  - name: Instance Organizations
    description: Organizations belonging to a customer application instance, rather than Clerk workspaces.
  - name: JWT Templates
    description: Operations for managing JWT templates within an application instance.
  - name: Redirect URLs
    description: Operations for managing redirect URLs within an application instance.
  - name: Native Applications
    description: Operations for configuring Native API support and registering native applications with an application instance.
  - name: OAuth
    description: 'Operations for the OAuth authorization server an instance runs: the protected resources registered on it, including MCP servers, and its instance-wide settings.'
  - name: Config
    description: Operations for managing instance configuration. The config API provides a unified interface for reading and updating instance settings, including authentication methods, SSO connections, and other instance-level configuration options.
externalDocs:
  url: https://clerk.com/docs
paths:
  /platform/applications/{applicationID}/instances/{envOrInsID}/users/{userID}/organization_memberships:
    get:
      operationId: PlatformListUserOrganizationMemberships
      x-speakeasy-group: platform
      x-speakeasy-name-override: listUserOrganizationMemberships
      tags:
        - Instance Organizations
      summary: List a user's organization memberships
      description: |
        Returns the Backend API membership objects, including roles, permissions, nested
        organizations, public user data, and organization and membership private metadata.
        Memberships are ordered newest first by membership creation time. The user must
        belong to the selected application instance. Organizations must be enabled.
        Requires both `organizations:read` and `users:read` scopes.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          required: true
          description: Application ID.
          schema:
            type: string
        - name: envOrInsID
          in: path
          required: true
          description: Development, production, or a full instance ID.
          schema:
            type: string
        - name: userID
          in: path
          required: true
          description: ID of a user in the selected instance.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. Values outside 1 to 500 use the default of 10.
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: Memberships to skip. Negative values are treated as zero.
          schema:
            type: integer
            default: 0
      responses:
        '200':
          $ref: '#/components/responses/OrganizationMemberships'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /platform/applications/{applicationID}/instances/{envOrInsID}/organizations/{organizationID}/memberships:
    get:
      operationId: PlatformListInstanceOrganizationMemberships
      x-speakeasy-group: platform
      x-speakeasy-name-override: listInstanceOrganizationMemberships
      tags:
        - Instance Organizations
      summary: List members of an organization in an application instance
      description: |
        Lists memberships with roles, permissions, organization and public user data.
        Supports Backend API membership filters and pagination, and returns the same
        membership objects, including membership and organization private metadata.
        Requires both `organizations:read` and `users:read`, and organizations enabled on the instance.
        The organization must belong to the selected instance.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          required: true
          schema:
            type: string
        - name: envOrInsID
          in: path
          required: true
          description: Development, production, or a full instance ID.
          schema:
            type: string
        - name: organizationID
          in: path
          required: true
          schema:
            type: string
        - in: query
          required: false
          name: order_by
          description: |-
            Sorts organization memberships by phone_number, email_address, created_at, first_name, last_name, username, or role.
            By prepending one of those values with + or -, we can choose to sort in ascending (ASC) or descending (DESC) order.
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: array
            items:
              type: string
          description: |-
            Returns memberships for the literal user IDs specified. IDs are not interpreted as
            include/exclude expressions. Any user IDs not found are ignored.
          required: false
        - name: email_address
          in: query
          schema:
            type: array
            items:
              type: string
          description: Returns users with the specified email addresses. Accepts up to 100 email addresses. Any email addresses not found are ignored.
          required: false
        - name: phone_number
          in: query
          schema:
            type: array
            items:
              type: string
          description: Returns users with the specified phone numbers. Accepts up to 100 phone numbers. Any phone numbers not found are ignored.
          required: false
        - name: username
          in: query
          schema:
            type: array
            items:
              type: string
          description: |-
            Returns users with the specified usernames.
            Accepts up to 100 usernames.
            Any usernames not found are ignored.
          required: false
        - name: web3_wallet
          in: query
          schema:
            type: array
            items:
              type: string
          description: |-
            Returns users with the specified web3 wallet addresses.
            Accepts up to 100 web3 wallet addresses.
            Any web3 wallet addresses not found are ignored.
          required: false
        - name: role
          in: query
          schema:
            type: array
            items:
              type: string
          description: Returns users with the specified roles. Accepts up to 100 roles. Any roles not found are ignored.
          required: false
        - name: query
          in: query
          description: |-
            Returns users that match the given query.
            For possible matches, we check the email addresses, phone numbers, usernames, web3 wallets, user IDs, first and last names.
            The query value doesn't need to match the exact value you are looking for, it is capable of partial matches as well.
          schema:
            type: string
          required: false
        - name: email_address_query
          in: query
          description: |-
            Returns users with emails that match the given query, via case-insensitive partial match.
            For example, `email_address_query=ello` will match a user with the email `HELLO@example.com`.
          schema:
            type: string
          required: false
        - name: phone_number_query
          in: query
          description: |-
            Returns users with phone numbers that match the given query, via case-insensitive partial match.
            For example, `phone_number_query=555` will match a user with the phone number `+1555xxxxxxx`.
          schema:
            type: string
          required: false
        - name: username_query
          in: query
          description: |-
            Returns users with usernames that match the given query, via case-insensitive partial match.
            For example, `username_query=CoolUser` will match a user with the username `SomeCoolUser`.
          schema:
            type: string
        - name: name_query
          in: query
          description: Returns users with names that match the given query, via case-insensitive partial match.
          schema:
            type: string
        - name: last_active_at_before
          in: query
          description: |-
            Returns users whose last session activity was before the given date (with millisecond precision).
            Example: use 1700690400000 to retrieve users whose last session activity was before 2023-11-23.
          example: 1700690400000
          schema:
            type: integer
        - name: last_active_at_after
          in: query
          description: |-
            Returns users whose last session activity was after the given date (with millisecond precision).
            Example: use 1700690400000 to retrieve users whose last session activity was after 2023-11-23.
          example: 1700690400000
          schema:
            type: integer
        - name: created_at_before
          in: query
          description: |-
            Returns users who have been created before the given date (with millisecond precision).
            Example: use 1730160000000 to retrieve users who have been created before 2024-10-29.
          example: 1730160000000
          schema:
            type: integer
        - name: created_at_after
          in: query
          description: |-
            Returns users who have been created after the given date (with millisecond precision).
            Example: use 1730160000000 to retrieve users who have been created after 2024-10-29.
          example: 1730160000000
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          $ref: '#/components/responses/OrganizationMemberships'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /platform/applications/{applicationID}/instances/{envOrInsID}/organizations:
    get:
      operationId: PlatformListInstanceOrganizations
      x-speakeasy-group: platform
      x-speakeasy-name-override: listInstanceOrganizations
      tags:
        - Instance Organizations
      summary: List organizations in an application instance
      description: |
        List or search organizations belonging to an application instance, rather than Clerk workspaces.
        Supports the Backend API organization-list filters and pagination, and returns the same
        organization objects, including private metadata. Organizations must be enabled on the instance.

        Requires the `organizations:read` scope.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          required: true
          description: Application ID.
          schema:
            type: string
        - name: envOrInsID
          in: path
          required: true
          description: Development, production, or a full instance ID.
          schema:
            type: string
        - in: query
          required: false
          name: include_members_count
          description: Flag to denote whether the member counts of each organization should be included in the response or not.
          schema:
            type: boolean
        - in: query
          required: false
          name: include_missing_member_with_elevated_permissions
          description: Include whether each organization is missing a member with elevated permissions.
          schema:
            type: boolean
        - in: query
          required: false
          name: query
          description: |-
            Returns organizations with ID, name, or slug that match the given query.
            Uses exact match for organization ID and partial match for name and slug.
          schema:
            type: string
        - in: query
          name: user_id
          description: |-
            Returns organizations that include any of the specified user IDs as members. Any user IDs not found are ignored.
            For each user ID, the `+` and `-` can be prepended to the ID, which denote whether the
            respective organization should be included or excluded from the result set.
          schema:
            type: array
            items:
              type: string
          required: false
        - in: query
          name: organization_id
          description: |-
            Returns organizations with the organization IDs specified. Any organization IDs not found are ignored.
            For each organization ID, the `+` and `-` can be prepended to the ID, which denote whether the
            respective organization should be included or excluded from the result set. Accepts up to 100 organization IDs.
            Example: ?organization_id=+org_1&organization_id=-org_2
          schema:
            type: array
            items:
              type: string
          required: false
        - in: query
          name: order_by
          description: |-
            Allows to return organizations in a particular order.
            Supported fields are `name`, `created_at`, `updated_at`, `last_active_at`, and `members_count`.
            In order to specify the direction, you can use the `+/-` symbols prepended in the property to order by.
            For example, if you want organizations to be returned in descending order according to their `created_at` property, you can use `-created_at`.
            If you don't use `+` or `-`, then `+` is implied.
            Defaults to `-created_at`.
          schema:
            type: string
            default: '-created_at'
          required: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: name
          in: query
          description: Filter by organization name.
          schema:
            type: string
        - name: slug
          in: query
          description: Filter by organization slug.
          schema:
            type: string
        - name: created_at_before
          in: query
          description: Return organizations created before this Unix timestamp in milliseconds.
          schema:
            type: string
        - name: created_at_after
          in: query
          description: Return organizations created after this Unix timestamp in milliseconds.
          schema:
            type: string
        - name: filter_by
          in: query
          description: Use `missing_member_with_elevated_permissions` or `without_sso_connections`. These filters cannot be combined. The first requires `include_missing_member_with_elevated_permissions=true`.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          $ref: '#/components/responses/Organizations'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /platform/applications:
    get:
      operationId: PlatformListApplications
      x-speakeasy-group: platform
      x-speakeasy-name-override: listApplications
      tags:
        - Applications
      summary: List applications
      description: |
        List applications, newest first.

        Without `paginated`, the response is an array of up to `limit` applications and does not say
        whether more exist. To walk every application, set `paginated=true`, pass each response's
        `cursor.starting_after` back as `starting_after`, and stop when `cursor.has_next_page` is `false`.
      security:
        - platform_api_access_token: []
      parameters:
        - name: include_secret_keys
          in: query
          description: Whether to include secret keys in the response.
          required: false
          schema:
            type: boolean
            default: false
        - name: paginated
          in: query
          description: Return `data` and a `cursor` instead of a bare array.
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Number of applications to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - name: starting_after
          in: query
          description: |
            Cursor for pagination. Provide the ID of the last application from the
            previous page to get the next page of results.
          required: false
          schema:
            type: string
        - name: ending_before
          in: query
          description: |
            Cursor for pagination. Provide the ID of the first application from the
            current page to get the previous page of results.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Applications retrieved successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlatformListApplicationsResponse'
                  - $ref: '#/components/schemas/PlatformListApplicationsCursorResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      operationId: PlatformCreateApplication
      x-speakeasy-group: platform
      x-speakeasy-name-override: createApplication
      tags:
        - Applications
      summary: Create an application
      description: |
        Create a new application.
      security:
        - platform_api_access_token: []
      requestBody:
        description: Application data to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformCreateApplicationRequest'
      responses:
        '200':
          description: Application created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApplicationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /platform/applications/{applicationID}:
    get:
      operationId: PlatformGetApplication
      x-speakeasy-group: platform
      x-speakeasy-name-override: getApplication
      tags:
        - Applications
      summary: Get an application
      description: |
        Get application details.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
        - name: include_secret_keys
          in: query
          description: Whether to include secret keys in the response. If 'true', the response will include the secret keys for each instance.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Application retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApplicationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    patch:
      operationId: PlatformUpdateApplication
      x-speakeasy-group: platform
      x-speakeasy-name-override: updateApplication
      tags:
        - Applications
      summary: Update an application
      description: |
        Update an application.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
      requestBody:
        description: Application data to update.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdateApplicationRequest'
      responses:
        '200':
          description: Application updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApplicationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: PlatformDeleteApplication
      x-speakeasy-group: platform
      x-speakeasy-name-override: deleteApplication
      tags:
        - Applications
      summary: Delete an application
      description: |
        Delete an application.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDeletedObjectResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /platform/applications/{applicationID}/logo:
    post:
      operationId: PlatformUploadApplicationLogo
      x-speakeasy-group: platform
      x-speakeasy-name-override: uploadApplicationLogo
      tags:
        - Applications
      summary: Upload application logo
      description: |
        Set or replace an application's logo by uploading an image file.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
          application/octet-stream:
            schema:
              type: string
            example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=
      responses:
        '200':
          description: Application logo uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApplicationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '413':
          $ref: '#/components/responses/ClerkErrors'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: PlatformDeleteApplicationLogo
      x-speakeasy-group: platform
      x-speakeasy-name-override: deleteApplicationLogo
      tags:
        - Applications
      summary: Delete application logo
      description: |
        Delete an application's logo.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application logo deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApplicationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
  /platform/applications/{applicationID}/favicon:
    post:
      operationId: PlatformUploadApplicationFavicon
      x-speakeasy-group: platform
      x-speakeasy-name-override: uploadApplicationFavicon
      tags:
        - Applications
      summary: Upload application favicon
      description: |
        Set or replace an application's favicon by uploading an image file.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
          application/octet-stream:
            schema:
              type: string
            example: data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAGAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '200':
          description: Application favicon uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformApplicationResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '413':
          $ref: '#/components/responses/ClerkErrors'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: PlatformDeleteApplicationFavicon
      x-speakeasy-group: platform
      x-speakeasy-name-override: deleteApplicationFavicon
      tags:
        - Applications
      summary: Delete application favicon
      description: |
        Delete an application's favicon.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
