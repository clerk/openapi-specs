  /platform/applications/{applicationID}/instances/{envOrInsID}/users:
    get:
      operationId: PlatformListInstanceUsers
      x-speakeasy-group: platform
      x-speakeasy-name-override: listInstanceUsers
      tags:
        - Users
      summary: List instance users
      description: |
        List all users for an application instance.

        The `envOrInsID` parameter can be either an environment type (e.g., "development", "production")
        or an instance ID.

        Use the `query` parameter to filter users by searching across email addresses, phone numbers,
        usernames, web3 wallets, user IDs, first names, and last names.

        Use the `order_by` parameter to sort the results. Prefix with `+` for ascending or `-` for descending order.
        Valid fields: `created_at`, `updated_at`, `last_sign_in_at`, `last_active_at`, `email_address`, `first_name`,
        `last_name`, `username`, `phone_number`, `web3_wallet`. Default is `-created_at` (most recent first).

        To walk more than a few pages, use `pagination=cursor` rather than `offset`: a large `offset`
        gets progressively slower and eventually times out. Cursor pagination requires the
        `created_at` ordering, which is the default.

        Requires the `users:read` scope.
      security:
        - platform_api_access_token: []
      parameters:
        - name: applicationID
          in: path
          description: Application ID.
          required: true
          schema:
            type: string
        - name: envOrInsID
          in: path
          description: |
            Environment type (e.g., "development", "production") or instance ID.
          required: true
          schema:
            type: string
        - name: query
          in: query
          description: |
            A search query to filter users. Searches across email addresses, phone numbers,
            usernames, web3 wallets, user IDs, first names, and last names.
          required: false
          schema:
            type: string
        - name: order_by
          in: query
          description: |
            Field to order results by. Prefix with `+` for ascending or `-` for descending order.
            Valid fields: `created_at`, `updated_at`, `last_sign_in_at`, `last_active_at`, `email_address`,
            `first_name`, `last_name`, `username`, `phone_number`, `web3_wallet`.
          required: false
          schema:
            type: string
            default: '-created_at'
        - name: limit
          in: query
          description: Number of results to return per page (1-500, default 10).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 10
        - name: offset
          in: query
          description: Number of results to skip for pagination.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pagination
          in: query
          description: |
            How to paginate the results. `offset`, the default when omitted, pages with `limit` and
            `offset` and returns `data` and `total_count`.

            `cursor` pages by cursor: pass the previous response's `cursor.starting_after` back as
            `starting_after`, and stop when `cursor.has_next_page` is `false`. The response is
            `data` and `cursor`, with no `total_count`. A cursor page costs the same no matter how
            far into the list it sits, while a large `offset` has to walk and discard every row
            before it, so use `cursor` to walk more than a few pages.
          required: false
          schema:
            type: string
            enum:
              - offset
              - cursor
        - name: starting_after
          in: query
          description: |
            With `pagination=cursor`, the `cursor.starting_after` of the previous page. Returns the users that follow it.
            Omit it for the first page. Rejected with a 422 without `pagination=cursor`.

            **Cursor pagination requires ordering by `created_at`**: `order_by` omitted, or set to `created_at`,
            `+created_at` or `-created_at`. Any other `order_by` value is rejected with a 422, because the other
            orderings sort by a value that is neither unique per user nor immutable, so a cursor over them would
            skip or repeat users.

            A non-zero `offset` is also rejected. Keep every other parameter identical across requests.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Users retrieved successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlatformListInstanceUsersResponse'
                  - $ref: '#/components/schemas/PlatformListInstanceUsersCursorResponse'
        '400':
          $ref: '#/components/responses/ClerkErrors'
        '401':
          $ref: '#/components/responses/AuthenticationInvalid'
        '403':
          $ref: '#/components/responses/AuthorizationInvalid'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
